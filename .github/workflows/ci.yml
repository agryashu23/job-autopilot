name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The unit tests cover the deterministic core (filters, pay floor,
      # external-apply detection, lifecycle, HTML cleanup) and need no
      # network, browser or Ollama.
      - run: pip install pyyaml requests pytest
      - run: python -m pytest -q tests

  web:
    name: Frontend build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # web/dist is committed so the app runs without Node; fail if it is stale.
      - run: git diff --exit-code -- web/dist
