<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: "Segoe UI", sans-serif; width: 330px; margin: 0; padding: 14px; color: #16202b; }
  h3 { margin: 0 0 4px; color: #1f4e8c; font-size: 15px; }
  p { margin: 4px 0; font-size: 12.5px; color: #5b6a7a; }
  button {
    width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px;
    background: #1f4e8c; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .result { margin-top: 10px; font-size: 12.5px; }
  .ok { color: #166534; font-weight: 600; }
  .warn { color: #92400e; }
  ul { margin: 4px 0 0 16px; padding: 0; max-height: 140px; overflow-y: auto; }
  li { margin-bottom: 3px; }
  .err { color: #b91c1c; font-weight: 600; }
  code { background: #eef1f5; padding: 1px 5px; border-radius: 4px; font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
  <h3>⚡ Job Autopilot Autofill</h3>
  <p>Fills this page's application form from your profile. File uploads get highlighted — attach your resume yourself, then <b>you</b> click submit.</p>
  <button id="fill">Fill forms on this page</button>
  <div id="out" class="result"></div>
  <script src="popup.js"></script>
</body>
</html>
